<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本の交通ルール 2026</title><style>*{box-sizing:border-box;}
h1{margin:0 0 6px;font-size:clamp(24px, 4vw, 38px);letter-spacing:0;line-height:1.2;}
p{margin:0;line-height:1.7;}
select, button{border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:40px;border-radius:6px;padding:8px 12px;font:inherit;}
button{cursor:pointer;font-weight:700;}
button.primary{border-color:var(--accent);background:var(--accent);color:#fff;}
button:disabled{opacity:.45;cursor:not-allowed;}
.quiz, .side{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.progress{color:var(--muted);font-weight:700;white-space:nowrap;}
.question-list{display:grid;gap:0;}
.question:last-child{border-bottom:0;}
.pending{display:inline-block;margin-top:8px;color:var(--warn);font-size:13px;font-weight:700;}
.answer-box input{position:absolute;opacity:0;pointer-events:none;}
.answer-box input:checked + label{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15, 118, 110, .15);color:var(--accent);}
.question.correct{background:#effaf5;}
.question.wrong{background:#fff3f0;}
.question.correct .explain, .question.wrong .explain{display:block;}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.metric{background:var(--soft);border-radius:8px;padding:12px;}
.metric b{display:block;font-size:28px;line-height:1;margin-bottom:4px;}
.metric span{color:var(--muted);font-size:13px;}
.road-wrap{margin:14px 0;padding:16px 14px 18px;background:#dce8ee;border-radius:8px;}
.road{position:relative;height:88px;border-radius:6px;background:linear-gradient(90deg, transparent 0 8%, rgba(255,255,255,.9) 8% 12%, transparent 12% 20%) 0 42px / 120px 4px repeat-x, var(--road);overflow:hidden;border:4px solid #202832;}
.finish{position:absolute;right:8px;top:0;width:18px;height:100%;background:linear-gradient(45deg, #fff 25%, #111 25% 50%, #fff 50% 75%, #111 75%) 0 0 / 18px 18px;opacity:.9;}
.car{position:absolute;left:8px;top:30px;width:54px;height:28px;border-radius:10px 15px 8px 8px;background:#dc2626;box-shadow:inset 12px -4px 0 rgba(0,0,0,.12);transform:translateX(0);transition:transform .35s cubic-bezier(.17,.84,.35,1);}
.car::before{content:"";position:absolute;left:14px;top:-10px;width:26px;height:14px;border-radius:10px 10px 0 0;background:#f8fafc;border:3px solid #dc2626;border-bottom:0;}
.car::after{content:"";position:absolute;left:7px;bottom:-6px;width:42px;height:12px;background:radial-gradient(circle at 6px 6px, #111 0 6px, transparent 6px), radial-gradient(circle at 36px 6px, #111 0 6px, transparent 6px);}
.result{min-height:96px;padding:14px;border-radius:8px;background:#fff;border:1px solid var(--line);}
.result h2{margin:0 0 8px;font-size:20px;line-height:1.3;}
.reward{margin:12px 0 4px;min-height:74px;display:grid;place-items:center;border-radius:8px;background:#f8fafc;overflow:hidden;position:relative;}
.reward strong{position:relative;z-index:2;font-size:22px;line-height:1.35;text-align:center;}
.reward-perfect{background:#fff7ed;color:#9a3412;}
.reward-perfect::before{content:"★ ★ ★ ★ ★";position:absolute;inset:10px 0 auto;text-align:center;color:#f59e0b;font-size:28px;animation:sparkle 1s ease-in-out infinite alternate;}
.reward-almost{background:#ecfeff;color:#155e75;}
.reward-almost::before{content:"";position:absolute;width:42px;height:42px;border-radius:50%;background:#22d3ee;left:16px;top:16px;animation:roll 1.2s ease-in-out infinite alternate;opacity:.8;}
.reward-try{background:#eef2ff;color:#3730a3;}
.reward-try strong{animation:bounceText .9s ease-in-out infinite alternate;}
@keyframes sparkle{ from { transform: translateY(10px) scale(.9); opacity: .65; } to { transform: translateY(-2px) scale(1.08); opacity: 1; } }
@keyframes roll{ from { transform: translateX(0) rotate(0deg); } to { transform: translateX(220px) rotate(360deg); } }
@keyframes bounceText{ from { transform: translateY(5px); } to { transform: translateY(-5px); } }
.notice{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.7;}
.actions{display:grid;gap:10px;margin-top:14px;}
@media (max-width: 860px){header, .layout{grid-template-columns:1fr;}
.toolbar{justify-content:stretch;}
select, button{width:100%;}
.side{position:static;}
.question{grid-template-columns:40px minmax(0, 1fr);}
.answer-box{grid-column:2;width:100%;grid-template-columns:1fr 1fr;}
.explain{grid-column:2;}}
:root{color-scheme:light;--panel:#ffffff;--soft:#f4f7fb;--road:#303842;--warn:#b45309;--accent:#087e80;--ink:#162d43;--muted:#5a6e80;--line:#dce5e9;font-family:"Yu Gothic UI",Meiryo,system-ui,sans-serif;}
body{margin:0;color:var(--ink);background:#f3f6f7;}
main{margin:0 auto;padding:22px 0 36px;width:min(1200px,calc(100% - 32px));padding-top:24px;}
header{display:grid;grid-template-columns:minmax(0, 1fr) auto;gap:16px;padding:0 0 16px;border-bottom:1px solid var(--line);align-items:center;border:0;}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--accent);margin-bottom:10px;}
.version{display:inline-block;padding:5px 10px;background:#dff1ed;border-radius:5px;font-size:12px;font-weight:700;}
.lead{color:var(--muted);max-width:780px;font-size:14px;margin-top:10px;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:flex-start;}
select{max-width:100%;}
button:hover:not(:disabled){filter:brightness(.94);}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e7a92c;outline-offset:3px;}
.nav{display:flex;gap:6px;margin:20px 0 14px;flex-wrap:wrap;}
.nav button{width:auto;background:transparent;border-color:transparent;color:var(--muted);}
.nav button[aria-selected=true]{background:var(--ink);color:white;}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 18px;}
.summary article{background:white;border:1px solid var(--line);border-radius:10px;padding:15px 18px;}
.summary small{font-size:12px;color:var(--muted);}
.summary strong{display:block;font-size:19px;line-height:1.5;}
.summary .date{font-size:12px;color:var(--accent);font-weight:700;}
.layout{display:grid;gap:16px;align-items:start;margin-top:12px;grid-template-columns:minmax(0,1fr) 295px;}
.side{padding:16px;position:sticky;top:14px;border-radius:12px;}
.quiz{border-radius:12px;}
.quiz-head{display:grid;grid-template-columns:minmax(0, 1fr) auto;gap:10px;background:#f8fafc;border-bottom:1px solid var(--line);align-items:center;padding:18px 22px;}
.question{display:grid;align-items:start;border-bottom:1px solid var(--line);grid-template-columns:36px minmax(0,1fr) 100px;padding:22px;gap:12px;}
.qtext{line-height:1.65;font-size:16px;}
.sign-q{display:block;max-width:110px;height:100px;object-fit:contain;margin:12px 0 6px;}
.answer-box{display:grid;gap:6px;min-width:100px;width:100px;grid-template-columns:45px 45px;}
.answer-box label{display:grid;place-items:center;height:42px;border:1px solid var(--line);border-radius:6px;font-size:22px;font-weight:900;background:#fff;cursor:pointer;width:45px;min-height:45px;}
.answer-box input:focus-visible+label{outline:3px solid #d79d1d;outline-offset:3px;}
.explain{display:none;grid-column:2 / 4;margin-top:-4px;color:var(--muted);font-size:14px;line-height:1.9;}
.original{display:block;margin-top:8px;color:var(--muted);line-height:1.55;font-size:12px;}
.caption{font-size:12px;color:var(--muted);}
.scope{font-size:13px;color:var(--muted);padding:0 2px;}
.quiz-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;}
.quiz-tools select{flex:1;min-width:170px;}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin:12px 0;}
.panel h2{font-size:22px;margin:0 0 16px;}
.panel h3{font-size:17px;margin:0 0 8px;}
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;}
.guide-card{background:#f7fafb;border:1px solid var(--line);border-radius:9px;padding:20px;}
.guide-card b{font-size:12px;color:var(--accent);}
.guide-card p{font-size:14px;}
.guide-card .jp{font-size:12px;color:var(--muted);margin-top:10px;}
.sign-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.sign-card{border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center;}
.sign-card img{width:110px;height:105px;object-fit:contain;margin-bottom:14px;}
.sign-card h3{font-size:16px;margin:0 0 8px;}
.sign-card p{font-size:13px;}
.table-wrap{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);}
th{background:#f2f7f8;}
td:last-child{white-space:nowrap;font-weight:700;}
.footnote{font-size:13px;color:var(--muted);margin:15px 0 0;}
.source-link{font-size:12px;color:var(--accent);display:block;margin-top:8px;}
a{color:var(--accent);}
.sources li{margin:10px 0;line-height:1.7;}
.source-kind{color:var(--muted);font-size:12px;}
.review-toggle{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:8px;}
.review-toggle input{width:17px;height:17px;}
.empty{padding:28px;}
.quiz-tools button{white-space:nowrap;}
[hidden]{display:none!important;}
.mini-list{padding-left:22px;line-height:1.9;}
.updated{border-left:4px solid var(--accent);}
.app-footer{margin-top:25px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.8;}
.score .metric b{font-size:32px;}
.quiz-title{margin:0;line-height:1.35;font-size:18px;}
.num{display:grid;place-items:center;border-radius:50%;background:var(--soft);font-weight:800;color:var(--muted);font-size:12px;width:30px;height:30px;}
.summary article:first-child{border-top:3px solid var(--accent);}
@media(max-width:800px){header{grid-template-columns:1fr;}
.toolbar{justify-content:flex-start;}
.layout{grid-template-columns:1fr;}
.side{position:static;}
.summary article{padding:12px 16px;}
.summary strong{font-size:17px;}
.sign-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
.guide-grid{grid-template-columns:1fr;}
.question{grid-template-columns:30px minmax(0,1fr);padding:16px;}
.answer-box{grid-column:2;justify-self:start;}
.question .explain{grid-column:2;}
.summary{grid-template-columns:1fr;gap:8px;}
.panel{padding:17px;}
h1{font-size:28px;}}
@media(prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation:none!important;}}
@media print{.toolbar,.nav,.quiz-tools,.actions,.road-wrap,.answer-box{display:none;}
.layout{display:block;}
.side{position:static;}
.question{break-inside:avoid;}
.sign-grid{grid-template-columns:repeat(3,1fr);}
body{background:white;}
.summary{display:none;}}.history-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.history-tools button{font-size:12px;width:auto}@media print{.history-tools{display:none}}

const patterns = [{"id": 21, "title": "2026年改正・青切符", "titleI18n": {"ja": "2026年改正・青切符", "en": "2026 changes & blue tickets", "ko": "2026년 개정·청색 통고", "zhCN": "2026年修法与蓝单", "zhTW": "2026年修法與藍單", "th": "กฎใหม่ปี 2026 และใบสั่งสีน้ำเงิน", "vi": "Thay đổi 2026 và vé xanh"}, "questions": [{"no": 1, "question": "2026年4月1日から、自転車の青切符は16歳以上が対象である。", "explanation": "16歳未満は青切符の対象外ですが、交通ルールは守る必要があります。", "answer": true, "sign": "", "source": "system", "i18n": {"en": {"question": "Since 1 April 2026, bicycle blue tickets apply to riders aged 16 or older.", "explanation": "Under-16s are outside this scheme, but must still obey traffic rules."}, "zhCN": {"question": "2026年4月1日起，自行车蓝单制度适用于16岁及以上骑车人。", "explanation": "未满16岁不适用蓝单，但仍须遵守交通规则。"}, "zhTW": {"question": "2026年4月1日起，自行車藍單制度適用於16歲以上騎車人。", "explanation": "未滿16歲不適用藍單，但仍須遵守交通規則。"}, "ko": {"question": "2026년 4월 1일부터 자전거 청색 교통위반 통고제도는 16세 이상에게 적용된다.", "explanation": "16세 미만은 청색 통고 대상이 아니지만 교통법규를 지켜야 합니다."}, "vi": {"question": "Từ 1/4/2026, chế độ vé xanh cho xe đạp áp dụng với người từ đủ 16 tuổi.", "explanation": "Người dưới 16 tuổi không thuộc chế độ này nhưng vẫn phải tuân thủ luật giao thông."}, "th": {"question": "ตั้งแต่ 1 เมษายน 2026 ระบบใบสั่งสีน้ำเงินสำหรับจักรยานใช้กับผู้ขับขี่อายุ 16 ปีขึ้นไป", "explanation": "ผู้มีอายุต่ำกว่า 16 ปีไม่อยู่ในระบบนี้ แต่ยังต้องปฏิบัติตามกฎจราจร"}}, "concept": "blue-age"}, {"no": 2, "question": "外国人は、自転車の青切符の対象にならない。", "explanation": "国籍による免除はありません。日本で走る人は日本のルールを守ります。", "answer": false, "sign": "", "source": "system", "i18n": {"en": {"question": "Foreign nationals are exempt from bicycle blue tickets.", "explanation": "There is no nationality exemption. Follow Japanese rules when riding in Japan."}, "zhCN": {"question": "外国人不适用自行车蓝单制度。", "explanation": "不因国籍而豁免。在日本骑车须遵守日本规则。"}, "zhTW": {"question": "外國人不適用自行車藍單制度。", "explanation": "不因國籍而豁免。在日本騎車須遵守日本規則。"}, "ko": {"question": "외국인은 자전거 청색 교통위반 통고 대상이 아니다.", "explanation": "국적에 따른 면제는 없습니다. 일본에서는 일본의 규칙을 지켜야 합니다."}, "vi": {"question": "Người 纳蓝单罚款就一定能结案。", "explanation": "醉酒驾驶和达到法定酒精浓度的驾驶属于刑事程序处理对象。"}, "zhTW": {"question": "自行車酒駕只要繳納藍單反則金就一定能結案。", "explanation": "酒醉駕駛和達法定酒精濃度的駕駛屬於刑事程序處理對象。"}, "ko": {"question": "자전거 음주운전은 청색 통고의 범칙금만 내면 반드시 끝난다.", "explanation": "술에 취한 운전과 법정 알코올 기준 이상의 운전은 형사절차 대상입니다."}, "vi": {"question": "Đi xe đạp sau khi uống rượu luôn chỉ cần nộp tiền vé xanh là xong.", "explanation": "Lái xe trong tình trạng say hoặc vượt ngưỡng nồng độ cồn bị xử lý theo thủ tục hình sự."}, "th": {"question": "เมาแล้วขี่จักรยานจบเรื่องได้เสมอเพียงชำระเงินตามใบสั่งสีน้ำเงิน", "explanation": "การขี่ขณะมึนเมาหรือมีแอลกอฮอล์ถึงเกณฑ์กฎหมายอยู่ในกระบวนการอาญา"}}, "concept": "blue-criminal"}, {"no": 5, "question": "自転車の携帯電話使用等（保持）の反則金は12,000円である。", "explanation": "16歳以上の反則行為の場合です。交通の危険を生じさせた場合は刑事手続になります。", "answer": true, "sign": "", "source": "fine", "i18n": {"en": {"question": "The blue-ticket penalty for handheld phone use while cycling is ¥12,000.", "explanation": "This applies to eligible violations by riders aged 16+. Creating a traffic danger is handled criminally."}, "zhCN": {"question": "骑自行车手持手机通话等违法的反则金为12,000日元。", "explanation": "适用于16岁以上的相关反则行为；造成交通危险时进入刑事程序。"}, "zhTW": {"question": "騎自行車手持手機通話等違規的反則金為12,000日圓。", "explanation": "適用於16歲以上的相關反則行為；造成交通危險時進入刑事程序。"}, "ko": {"question": "자전거 주행 중 휴대전화를 손에 들고 통화하는 등의 위반 범칙금은 12,000엔이다.", "explanation": "16세 이상 해당 범칙행위에 적용됩니다. 교통 위험을 발생시키면 형사절차 대상입니다."}, "vi": {"question": "Khoản tiền phạt theo vé xanh cho việc cầm điện thoại gọi khi đạp xe là 12.000 yên.", "explanation": "Áp dụng cho hành vi thuộc chế độ của người từ đủ 16 tuổi. Gây nguy hiểm giao thông sẽ bị xử lý hình sự."}, "th": {"question": "เงินชำระตามใบสั่งสำหรับการถือโทรศัพท์คุยขณะขี่จักรยานคือ 12,000 เยน", "explanation": "ใช้กับการฝ่าฝืนที่เข้าเกณฑ์ของผู้มีอายุ 16 ปีขึ้นไป หากก่ออันตรายต่อการจราจรจะเข้าสู่กระบวนการอาญา"}}, "concept": "bike-phone-penalty"}, {"no": 6, "question": "2026年9月1日から、対象となる生活道路の自動車の法定最高速度は30km/hである。", "explanation": "中央線・車両通行帯・中央分離帯等のない対象道路に適用。自動車専用道路等は除外されます。", "answer": true, "sign": "", "source": "speed", "i18n": {"en": {"question": "Since 1 September 2026, the default car speed limit on covered local roads is 30 km/h.", "explanation": "This covers eligible roads without centre lines, vehicle lanes or directional separation; motorways and other excluded roads are outside this change."}, "zhCN": {"question": "2026年9月1日起，适用生活道路的汽车法定最高时速为30公里。", "explanation": "适用于没有中央线、车辆通行带或方向分隔等的相关道路；汽车专用道路等除外。"}, "zhTW": {"question": "2026年9月1日起，適用生活道路的汽車法定最高時速為30公里。", "explanation": "適用於沒有中央線、車輛通行帶或方向分隔等的相關道路；汽車專用道路等除外。"}, "ko": {"question": "2026년 9월 1일부터 대상 생활도로에서 자동차의 법정 최고속도는 시속 30km이다.", "explanation": "중앙선·차량통행대·방향별 분리시설 등이 없는 대상 도로에 적용됩니다. 자동차전용도로 등은 제외됩니다."}, "vi": {"question": "Từ 1/9/2026, giới hạn tốc độ mặc định của ô tô trên đường dân sinh thuộc diện áp dụng là 30 km/h.", "explanation": "Áp dụng cho đường đủ điều kiện không có vạch tim, làn xe hoặc phân cách hai chiều; loại trừ đường dành riêng cho ô tô và các trường hợp khác."}, "th": {"question": "ตั้งแต่ 1 กันยายน 2026 ความเร็วสูงสุดตามกฎหมายของรถยนต์บนถนนชุมชนที่เข้าเกณฑ์คือ 30 กม./ชม.", "explanation": "ใช้กับถนนที่เข้าเกณฑ์ซึ่งไม่มีเส้นกลาง ช่องเดินรถ หรือการแยกทิศทาง เป็นต้น ยกเว้นถนนเฉพาะรถยนต์และถนนที่กำหนดอื่น ๆ"}}, "concept": "local-speed"}, {"no": 7, "question": "対象の生活道路でも、最高速度50km/hの標識を無視して必ず30km/hで走る。", "explanation": "道路標識・標示で指定された最高速度が優先します。状況に応じてさらに減速します。", "answer": false, "sign": "speed", "source": "speed", "i18n": {"en": {"question": "Even on a covered local road, you must ignore a posted 50 km/h limit and always use 30 km/h.", "explanation": "A posted or marked speed limit takes precedence. Slow further when conditions require."}, "zhCN": {"question": "即使生活道路设有50公里限速标志，也必须忽略标志，一律按30公里限速。", "explanation": "标志或路面标示指定的限速优先。必要时进一步减速。"}, "zhTW": {"question": "即使生活道路設有50公里速限標誌，也必須忽略標誌，一律按30公里速限。", "explanation": "標誌或路面標示指定的速限優先。必要時進一步減速。"}, "ko": {"question": "대상 생활도로에서도 50km/h 표지를 무시하고 반드시 30km/h 제한을 적용해야 한다.", "explanation": "표지나 노면표시로 지정된 최고속도가 우선합니다. 상황에 따라 더 감속하세요."}, "vi": {"question": "Trên đường dân sinh thuộc diện áp dụng, phải bỏ qua biển 50 km/h và luôn dùng giới hạn 30 km/h.", "explanation": "Tốc độ do biển báo hoặc vạch đường quy định được ưu tiên. Giảm thêm tốc độ khi cần."}, "th": {"question": "แม้ถนนชุมชนจะมีป้ายจำกัด 50 กม./ชม. ก็ต้องไม่สนใจป้ายและใช้ 30 กม./ชม. เสมอ", "explanation": "ความเร็วที่กำหนดด้วยป้ายหรือเครื่องหมายบนถนนมีผลก่อน ลดความเร็วเพิ่มตามสภาพการณ์"}}, "concept": "posted-speed"}, {"no": 8, "question": "2026年4月1日施行の規定では、自動車が自転車の右側を通過する際、十分な間隔がない場合は間隔に応じた安全な速度で進む。", "explanation": "追越しに該当する場合を除く側方通過の規定です。無理に通過せず、安全を確保します。", "answer": true, "sign": "", "source": "law", "i18n": {"en": {"question": "Under the rule effective 1 April 2026, a motor vehicle passing to a bicycle’s right without enough clearance must use a speed safe for that gap.", "explanation": "This new lateral-passing rule excludes overtaking as legally defined. Do not force an unsafe pass."}, "zhCN": {"question": "2026年4月1日施行的规定要求，汽车从自行车右侧通过、间距不足时，须以与间距相应的安全速度通过。", "explanation": "此侧方通过规定不包括法律定义的超车。不可勉强通过。"}, "zhTW": {"question": "2026年4月1日施行的規定要求，汽車從自行車右側通過、間距不足時，須以與間距相應的安全速度通過。", "explanation": "此側方通過規定不包括法律定義的超車。不可勉強通過。"}, "ko": {"question": "2026년 4월 1일 시행 규정에 따라 자동차가 자전거 오른쪽을 통과할 때 간격이 부족하면 간격에 맞는 안전한 속도로 진행한다.", "explanation": "법률상 추월에 해당하는 경우를 제외한 측방 통과 규정입니다. 무리하게 통과하지 마세요."}, "vi": {"question": "Theo quy định từ 1/4/2026, ô tô đi qua bên phải xe đạp mà khoảng cách không đủ phải đi với tốc độ an toàn phù hợp khoảng cách.", "explanation": "Quy định đi qua bên hông mới này không bao gồm vượt xe theo định nghĩa pháp luật. Không cố đi qua khi thiếu an toàn."}, "th": {"question": "ตามกฎที่มีผล 1 เมษายน 2026 เมื่อรถยนต์ผ่านด้านขวาของจักรยานโดยมีระยะไม่พอ ต้องใช้ความเร็วที่ปลอดภัยตามระยะนั้น", "explanation": "กฎการผ่านด้านข้างใหม่นี้ไม่รวมการแซงตามนิยามกฎหมาย อย่าฝืนผ่านอย่างไม่ปลอดภัย"}}, "concept": "bicycle-passing"}, {"no": 9, "question": "自転車のながらスマホの罰則強化は、2026年に初めて施行された。", "explanation": "罰則強化は2024年11月1日施行。2026年4月に青切符制度が加わりました。", "answer": false, "sign": "", "source": "phone", "i18n": {"en": {"question": "Stricter penalties for phone use while cycling first took effect in 2026.", "explanation": "The stricter penalties took effect on 1 November 2024; the blue-ticket scheme followed in April 2026."}, "zhCN": {"question": "自行车使用手机的处罚强化首次于2026年实施。", "explanation": "处罚强化于2024年11月1日施行；蓝单制度于2026年4月加入。"}, "zhTW": {"question": "自行車使用手機的罰則強化首次於2026年實施。", "explanation": "罰則強化於2024年11月1日施行；藍單制度於2026年4月加入。"}, "ko": {"question": "자전거 주행 중 휴대전화 사용에 대한 처벌 강화는 2026년에 처음 시행되었다.", "explanation": "처벌 강화는 2024년 11월 1일 시행되었고, 2026년 4월에 청색 통고제도가 추가되었습니다."}, "vi": {"question": "Việc tăng nặng xử phạt dùng điện thoại khi đạp xe lần đầu có hiệu lực vào năm 2026.", "explanation": "Tăng nặng có hiệu lực từ 1/11/2024; vé xanh được áp dụng thêm từ tháng 4/2026."}, "th": {"question": "การเพิ่มโทษใช้โทรศัพท์ขณะขี่จักรยานเริ่มมีผลครั้งแรกในปี 2026", "explanation": "เพิ่มโทษตั้งแต่ 1 พฤศจิกายน 2024 ส่วนระบบใบสั่งสีน้ำเงินเริ่มในเมษายน 2026"}}, "concept": "phone-date"}, {"no": 10, "question": "警察官は青切符を交付したその場で、現金の反則金を徴収する。", "explanation": "現場では徴収しません。交付された納付書の案内に従います。", "answer": false, "sign": "", "source": "faq", "i18n": {"en": {"question": "Police collect the blue-ticket payment in cash at the roadside.", "explanation": "Police do not collect it at the scene. Follow the instructions on the issued payment slip."}, "zhCN": {"question": "警察发蓝单时会在现场收取现金反则金。", "explanation": "警察不在现场收款。请按缴款单指示办理。"}, "zhTW": {"question": "警察開藍單時會在現場收取現金反則金。", "explanation": "警察不在現場收款。請依繳款單指示辦理。"}, "ko": {"question": "경찰관은 청색 통고서를 발부한 현장에서 현금 범칙금을 받는다.", "explanation": "현장에서는 받지 않습니다. 발급된 납부서의 안내를 따르세요."}, "vi": {"question": "Cảnh sát thu tiền mặt ngay tại hiện trường khi cấp vé xanh.", "explanation": "Không thu tại hiện trường. Hãy làm theo hướng dẫn trên giấy nộp tiền."}, "th": {"question": "ตำรวจรับเงินสด ณ จุดเกิดเหตุเมื่อออกใบสั่งสีน้ำเงิน", "explanation": "ตำรวจไม่รับชำระที่จุดนั้น ให้ทำตามคำแนะนำในเอกสารชำระเงิน"}}, "concept": "blue-payment"}]}, {"id": 22, "title": "自転車の基本・罰則", "titleI18n": {"ja": "自転車の基本・罰則", "en": "Cycling rules & penalties", "ko": "자전거 규칙·벌칙", "zhCN": "自行车规则与处罚", "zhTW": "自行車規則與罰則", "th": "กฎจักรยานและบทลงโทษ", "vi": "Quy tắc xe đạp và chế tài"}, "questions": [{"no": 1, "question": "自転車は原則として車道の左側を通行する。", "explanation": "自転車も車両です。車道を右側通行してはいけません。", "answer": true, "sign": "", "source": "rules", "i18n": {"en": {"question": "Bicycles normally travel on the left side of the roadway.", "explanation": "Bicycles are vehicles. Do not ride on the right side of the roadway."}, "zhCN": {"question": "自行车原则上应在车行道左侧通行。", "explanation": "自行车也是车辆，不得在车行道右侧逆向骑行。"}, "zhTW": {"question": "自行車原則上應在車道左側通行。", "explanation": "自行車也是車輛，不得在車道右側逆向騎行。"}, "ko": {"question": "자전거는 원칙적으로 차도 왼쪽으로 통행한다.", "explanation": "자전거도 차량입니다. 차도 오른쪽으로 역주행하면 안 됩니다."}, "vi": {"question": "Xe đạp về nguyên tắc đi bên trái phần đường xe chạy.", "explanation": "Xe đạp cũng là phương tiện. Không đi ngược chiều ở bên phải phần đường xe chạy."}, "th": {"question": "โดยหลักจักรยานต้องขี่ด้านซ้ายของทางเดินรถ", "explanation": "จักรยานเป็นยานพาหนะเช่นกัน ห้ามขี่ย้อนทางที่ด้านขวาของทางเดินรถ"}}, "concept": "bike-left"}, {"no": 2, "question": "自転車は、どの歩道でも自由に走ってよい。", "explanation": "普通自転車は標識の許可、13歳未満・70歳以上等、車道が危険な具体的状況などで例外的に歩道通行できます。", "answer": false, "sign": "", "source": "faq", "i18n": {"en": {"question": "Bicycles may freely use every sidewalk.", "explanation": "Ordinary bicycles may use sidewalks only under exceptions: signs allowing it, riders under 13 or 70+, certain disabilities, or specific dangerous road conditions."}, "zhCN": {"question": "自行车可随意在人行道上骑行。", "explanation": "普通自行车仅在标志允许、骑车人未满13岁或70岁以上、特定残障或车道有具体危险等例外下可走人行道。"}, "zhTW": {"question": "自行車可自由在人行道上騎行。", "explanation": "普通自行車僅在標誌允許、騎車人未滿13歲或70歲以上、特定身體障礙或車道有具體危險等例外下可走人行道。"}, "ko": {"question": "자전거는 어느 보도에서나 자유롭게 달릴 수 있다.", "explanation": "일반 자전거는 표지 허용, 13세 미만·70세 이상, 특정 장애 또는 차도의 구체적 위험 등 예외에서만 보도를 통행할 수 있습니다."}, "vi": {"question": "Xe đạp được tự do đi trên mọi vỉa hè.", "explanation": "Xe đạp thông thường chỉ được đi theo ngoại lệ: biển cho phép, người dưới 13 hoặc từ 70 tuổi, một số dạng khuyết tật hoặc điều kiện đường cụ thể nguy hiểm."}, "th": {"question": "จักรยานขี่บนทางเท้าทุกแห่งได้อย่างอิสระ", "explanation": "จักรยานทั่วไปใช้ทางเท้าได้เฉพาะข้อยกเว้น เช่น ป้ายอนุญาต ผู้ขี่อายุต่ำกว่า 13 หรือ 70 ปีขึ้นไป ความพิการบางกรณี หรือสภาพทางเดินรถที่มีอันตรายเฉพาะ"}}, "concept": "bike-sidewalk"}, {"no": 3, "question": "歩道を通行できる場合でも、自転車は歩行者の通行を妨げるなら一時停止する。", "explanation": "原則は歩道の車道寄りを徐行。歩行者が優先です。", "answer": true, "sign": "shared", "source": "rules", "i18n": {"en": {"question": "Even where sidewalk cycling is allowed, a cyclist must stop if obstructing pedestrians.", "explanation": "Normally ride slowly on the roadway side of the sidewalk. Pedestrians have priority."}, "zhCN": {"question": "即使允许在人行道上骑车，妨碍行人时也必须停车。", "explanation": "原则上在人行道靠车行道一侧慢行，行人优先。"}, "zhTW": {"question": "即使允許在人行道上騎車，妨礙行人時也必須停車。", "explanation": "原則上在人行道靠車道一側慢行，行人優先。"}, "ko": {"question": "보도 통행이 허용되어도 보행자의 통행을 방해하면 자전거는 일시정지해야 한다.", "explanation": "원칙적으로 보도의 차도 쪽을 서행합니다. 보행자가 우선입니다."}, "vi": {"question": "Dù được đi trên vỉa hè, xe đạp phải dừng nếu cản trở người đi bộ.", "explanation": "Thông thường đi chậm ở phần vỉa hè phía gần đường xe chạy. Người đi bộ được ưu tiên."}, "th": {"question": "แม้อนุญาตให้ขี่บนทางเท้า จักรยานต้องหยุดหากกีดขวางคนเดินเท้า", "explanation": "โดยหลักขี่ช้า ๆ ทางด้านติดถนน คนเดินเท้ามีสิทธิก่อน"}}, "concept": "bike-pedestrian"}, {"no": 4, "question": "自転車には「止まれ」の一時停止標識は適用されない。", "explanation": "自転車も停止線の直前で完全に停止します。停止線がなければ交差点の直前です。", "answer": false, "sign": "stop", "source": "rules", "i18n": {"en": {"question": "STOP signs do not apply to bicycles.", "explanation": "Cyclists must stop fully before the stop line, or just before the intersection if there is no line."}, "zhCN": {"question": "自行车不适用“止まれ”停车标志。", "explanation": "自行车也须在停止线前完全停车；无停止线则在路口前停车。"}, "zhTW": {"question": "自行車不適用「止まれ」停車標誌。", "explanation": "自行車也須在停止線前完全停車；無停止線則在路口前停車。"}, "ko": {"question": "자전거에는 ‘止まれ’ 일시정지 표지가 적용되지 않는다.", "explanation": "자전거도 정지선 직전에 완전히 멈춥니다. 정지선이 없으면 교차로 직전입니다."}, "vi": {"question": "Biển STOP ‘止まれ’ không áp dụng cho xe đạp.", "explanation": "Xe đạp cũng phải dừng hẳn trước vạch dừng, hoặc ngay trước giao lộ nếu không có vạch."}, "th": {"question": "ป้ายหยุด ‘止まれ’ ไม่ใช้กับจักรยาน", "explanation": "จักรยานก็ต้องหยุดสนิทก่อนเส้นหยุด หากไม่มีเส้นให้หยุดก่อนทางแยก"}}, "concept": "stop-obligation"}, {"no": 5, "question": "自転車は、交差点で右折するとき、交差点の側端に沿って二段階で右折する。", "explanation": "自動車のように右折車線へ入って曲がりません。信号のある交差点では、向きを変えた後も対面の信号に従います。", "answer": true, "sign": "", "source": "rules", "i18n": {"en": {"question": "Bicycles turn right in two stages along the edges of an intersection.", "explanation": "Do not use a car’s right-turn lane. At a signalised intersection, obey the signal facing you after changing direction."}, "zhCN": {"question": "自行车在交叉路口右转时，应沿路口边缘分两次转弯。", "explanation": "不得进入汽车右转车道。信号路口改变方向后，仍须遵守面向自己的信号。"}, "zhTW": {"question": "自行車在交叉路口右轉時，應沿路口邊緣分兩階段轉彎。", "explanation": "不得進入汽車右轉車道。有號誌的路口改變方向後，仍須遵守面向自己的號誌。"}, "ko": {"question": "자전거는 교차로 가장자리를 따라 두 단계로 우회전한다.", "explanation": "자동차 우회전 차로로 진입하지 않습니다. 신호 교차로에서는 방향을 바꾼 뒤에도 자신을 향한 신호를 따릅니다."}, "vi": {"question": "Xe đạp rẽ phải theo hai giai đoạn dọc mép giao lộ.", "explanation": "Không vào làn rẽ phải của ô tô. Ở giao lộ có đèn, sau khi đổi hướng vẫn phải theo đèn đối diện mình."}, "th": {"question": "จักรยานเลี้ยวขวาเป็นสองขั้นตามขอบทางแยก", "explanation": "อย่าเข้าช่องเลี้ยวขวาของรถยนต์ ทางแยกที่มีไฟ หลังเปลี่ยนทิศแล้วต้องทำตามไฟที่หันเข้าหาตน"}}, "concept": "bike-turn"}, {"no": 6, "question": "自転車は、夜間にライトを点灯する必要がある。", "explanation": "前照灯を点灯し、尾灯・反射器材なども確認します。", "answer": true, "sign": "", "source": "rules", "i18n": {"en": {"question": "Bicycles must use a light at night.", "explanation": "Use the front light and check the rear light or reflector equipment."}, "zhCN": {"question": "自行车夜间必须开灯。", "explanation": "打开前灯，并检查尾灯或反光装置。"}, "zhTW": {"question": "自行車夜間必須開燈。", "explanation": "打開前燈，並檢查尾燈或反光裝置。"}, "ko": {"question": "자전거는 야간에 전조등을 켜야 한다.", "explanation": "앞등을 켜고 뒷등이나 반사장치도 확인하세요."}, "vi": {"question": "Xe đạp phải bật đèn vào ban đêm.", "explanation": "Bật đèn trước, kiểm tra đèn sau hoặc bộ phận phản quang."}, "th": {"question": "จักรยานต้องเปิดไฟในเวลากลางคืน", "explanation": "เปิดไฟหน้าและตรวจไฟท้ายหรืออุปกรณ์สะท้อนแสง"}}, "concept": "bike-light"}, {"no": 7, "question": "自転車のヘルメット未着用は、必ず青切符の反則金になる。", "explanation": "全ての年齢で着用の努力義務があります。未着用そのものに罰則はありませんが、頭を守るため着用しましょう。", "answer": false, "sign": "", "source": "rules", "i18n": {"en": {"question": "Not wearing a bicycle helmet always results in a blue-ticket penalty.", "explanation": "Helmet use is an effort obligation for all ages. Non-use itself has no penalty; wear one to protect your head."}, "zhCN": {"question": "骑自行车不戴头盔，一定会被处以蓝单反则金。", "explanation": "所有年龄都有努力佩戴义务；不佩戴本身无罚则，但应佩戴以保护头部。"}, "zhTW": {"question": "騎自行車不戴安全帽，一定會被處以藍單反則金。", "explanation": "所有年齡都有努力佩戴義務；未戴本身無罰則，但應佩戴以保護頭部。"}, "ko": {"question": "자전거 헬멧을 쓰지 않으면 반드시 청색 통고 범칙금이 부과된다.", "explanation": "모든 연령에 착용 노력의무가 있습니다. 미착용 자체에 벌칙은 없지만 머리 보호를 위해 착용하세요."}, "vi": {"question": "Không đội mũ bảo hiểm xe đạp chắc chắn bị phạt tiền theo vé xanh.", "explanation": "Mọi độ tuổi đều có nghĩa vụ nỗ lực đội mũ. Không đội tự nó không có chế tài, nhưng nên đội để bảo vệ đầu."}, "th": {"question": "การไม่สวมหมวกนิรภัยจักรยานต้องถูกเรียกเก็บเงินตามใบสั่งสีน้ำเงินเสมอ", "explanation": "ทุกวัยมีหน้าที่พยายามสวมหมวก การไม่สวมเพียงอย่างเดียวไม่มีโทษ แต่ควรสวมเพื่อป้องกันศีรษะ"}}, "concept": "bike-helmet"}, {"no": 8, "question": "自転車にスマホを固定すれば、走行中に画面を注視してよい。", "explanation": "固定していても注視は禁止。交通の危険を生じさせると刑事手続の対象です。安全な場所に停止して操作します。", "answer": false, "sign": "", "source": "faq", "i18n": {"en": {"question": "It is legal to stare at a phone while cycling if it is mounted on the bicycle.", "explanation": "Staring is prohibited even with a mount. Creating a traffic danger can lead to criminal procedures. Stop safely to use it."}, "zhCN": {"question": "手机固定在自行车上，就可以在骑行时注视屏幕。", "explanation": "即使固定也禁止注视；造成交通危险可进入刑事程序。请安全停车后使用。"}, "zhTW": {"question": "手機固定在自行車上，就可以在騎行時注視螢幕。", "explanation": "即使固定也禁止注視；造成交通危險可進入刑事程序。請安全停車後使用。"}, "ko": {"question": "휴대전화를 자전거에 고정하면 주행 중 화면을 주시해도 된다.", "explanation": "고정해도 주시는 금지됩니다. 교통 위험을 발생시키면 형사절차 대상입니다. 안전한 곳에 정지하여 사용하세요."}, "vi": {"question": "Nếu gắn điện thoại cố định trên xe đạp, được nhìn chăm chú màn hình khi đi.", "explanation": "Nhìn chăm chú vẫn bị cấm. Gây nguy hiểm giao thông có thể bị xử lý hình sự. Dừng an toàn trước khi dùng."}, "th": {"question": "หากติดโทรศัพท์ไว้กับจักรยาน สามารถจ้องหน้าจอขณะขี่ได้", "explanation": "แม้ติดตั้งไว้ก็ห้ามจ้อง หากก่ออันตรายต่อการจราจรอาจเข้ากระบวนการอาญา ให้หยุดในที่ปลอดภัยก่อนใช้"}}, "concept": "phone-mounted"}, {"no": 9, "question": "少しの飲酒なら、自転車を運転してよい。", "explanation": "飲酒したら運転しません。酒気帯び運転も2024年11月1日から罰則の対象です。", "answer": false, "sign": "", "source": "alcohol", "i18n": {"en": {"question": "It is acceptable to cycle after a small amount of alcohol.", "explanation": "Do not ride after drinking. Cycling over the alcohol limit has also been punishable since 1 November 2024."}, "zhCN": {"question": "喝少量酒后可以骑自行车。", "explanation": "饮酒后不要骑车。达到法定酒精浓度的骑行自2024年11月1日起也有处罚。"}, "zhTW": {"question": "喝少量酒後可以騎自行車。", "explanation": "飲酒後不要騎車。達法定酒精濃度的騎行自2024年11月1日起也有處罰。"}, "ko": {"question": "술을 조금 마셨다면 자전거를 타도 된다.", "explanation": "음주 후에는 타지 마세요. 법정 알코올 기준 이상의 운전도 2024년 11월 1일부터 처벌 대상입니다."}, "vi": {"question": "Uống một chút rượu thì vẫn được đi xe đạp.", "explanation": "Không đi xe sau khi uống rượu. Đạp xe vượt ngưỡng nồng độ cồn cũng bị xử phạt từ 1/11/2024."}, "th": {"question": "ถ้าดื่มแอลกอฮอล์เพียงเล็กน้อยก็ขี่จักรยานได้", "explanation": "ห้ามขี่หลังดื่ม การขี่โดยมีแอลกอฮอล์ถึงเกณฑ์กฎหมายมีโทษตั้งแต่ 1 พฤศจิกายน 2024"}}, "concept": "bike-alcohol"}, {"no": 10, "question": "自転車で事故を起こした場合も、負傷者の救護・危険防止・警察への報告が必要である。", "explanation": "安全を確保し、けが人がいれば119、警察は110。相手が外国人でも対応は同じです。", "answer": true, "sign": "", "source": "rules", "i18n": {"en": {"question": "After a bicycle crash, you must help injured people, prevent further danger and report to police.", "explanation": "Secure safety, call 119 for injuries and 110 for police. The duties do not depend on nationality."}, "zhCN": {"question": "自行车发生事故后，也须救助伤者、防止危险并向警方报告。", "explanation": "确保安全，有伤者拨119，报警拨110。义务不因国籍而异。"}, "zhTW": {"question": "自行車發生事故後，也須救助傷者、防止危險並向警方報告。", "explanation": "確保安全，有傷者撥119，報警撥110。義務不因國籍而異。"}, "ko": {"question": "자전거 사고 시에도 부상자 구호·위험 방지·경찰 신고가 필요하다.", "explanation": "안전을 확보하고 부상자는 119, 경찰은 110입니다. 국적과 관계없이 같은 의무입니다."}, "vi": {"question": "Sau tai nạn xe đạp, cũng phải cứu giúp người bị thương, ngăn nguy hiểm và báo cảnh sát.", "explanation": "Bảo đảm an toàn; gọi 119 nếu có người bị thương, 110 cho cảnh sát. Nghĩa vụ không phụ thuộc quốc tịch."}, "th": {"question": "เมื่อเกิดอุบัติเหตุจักรยาน ต้องช่วยผู้บาดเจ็บ ป้องกันอันตราย และแจ้งตำรวจด้วย", "explanation": "รักษาความปลอดภัย โทร 119 เมื่อมีผู้บาดเจ็บ และ 110 แจ้งตำรวจ หน้าที่นี้ไม่ขึ้นกับสัญชาติ"}}, "concept": "accident-response"}]}, {"id": 23, "title": "標識を見て判断", "titleI18n": {"ja": "標識を見て判断", "en": "Read the signs", "ko": "표지 보고 판단하기", "zhCN": "看标志判断", "zhTW": "看標誌判斷", "th": "เรียนรู้ป้ายจราจร", "vi": "Nhận biết biển báo"}, "questions": [{"no": 1, "question": "この赤い逆三角形は、一時停止の標識である。", "explanation": "「止まれ」だけの旧様式も、「止まれ STOP」の様式も、完全停止が必要です。", "answer": true, "sign": "stop", "source": "signs", "i18n": {"en": {"question": "This red inverted triangle is a STOP sign.", "explanation": "Both Japanese-only and bilingual STOP signs require a complete stop."}, "zhCN": {"question": "这个红色倒三角形是停车标志。", "explanation": "仅写“止まれ”的旧样式和写“止まれ STOP”的样式均要求完全停车。"}, "zhTW": {"question": "這個紅色倒三角形是停車標誌。", "explanation": "僅寫「止まれ」的舊樣式和寫「止まれ STOP」的樣式均要求完全停車。"}, "ko": {"question": "이 빨간 역삼각형은 일시정지 표지이다.", "explanation": "‘止まれ’만 있는 옛 표지도 ‘止まれ STOP’ 표지도 완전 정지가 필요합니다."}, "vi": {"question": "Tam giác đỏ ngược này là biển STOP.", "explanation": "Cả mẫu chỉ ghi ‘止まれ’ và mẫu ‘止まれ STOP’ đều yêu cầu dừng hẳn."}, "th": {"question": "สามเหลี่ยมกลับหัวสีแดงนี้คือป้ายหยุด", "explanation": "ทั้งป้ายเก่าที่มีเพียง ‘止まれ’ และป้าย ‘止まれ STOP’ ต้องหยุดสนิท"}}, "concept": "stop-shape"}, {"no": 2, "question": "この「徐行」の標識では、止まらずに済むよう加速してよい。", "explanation": "直ちに停止できる速度で進みます。「徐行」は一時停止とは異なります。", "answer": false, "sign": "slow", "source": "signs", "i18n": {"en": {"question": "At this SLOW sign, you may accelerate to avoid stopping.", "explanation": "Proceed at a speed allowing an immediate stop. SLOW and STOP are different instructions."}, "zhCN": {"question": "看到这个“徐行”标志，可以加速以免停车。", "explanation": "须以能立即停车的速度前进。徐行与一时停止不同。"}, "zhTW": {"question": "看到這個「徐行」標誌，可以加速以免停車。", "explanation": "須以能立即停車的速度前進。徐行與一時停止不同。"}, "ko": {"question": "이 ‘徐行’ 표지에서는 멈추지 않도록 가속해도 된다.", "explanation": "즉시 정지할 수 있는 속도로 진행합니다. 서행과 일시정지는 다릅니다."}, "vi": {"question": "Tại biển ‘徐行’ này, được tăng tốc để tránh phải dừng.", "explanation": "Đi ở tốc độ có thể dừng ngay. Đi chậm và dừng bắt buộc là hai yêu cầu khác nhau."}, "th": {"question": "ที่ป้าย ‘徐行’ นี้ สามารถเร่งเพื่อไม่ต้องหยุดได้", "explanation": "ใช้ความเร็วที่หยุดได้ทันที การขี่ช้าและการหยุดเป็นคำสั่งต่างกัน"}}, "concept": "slow-sign"}, {"no": 3, "question": "この「車両進入禁止」は、自転車なら無条件で入れる。", "explanation": "自転車も対象です。「自転車を除く」等の補助標識があれば、その条件を確認します。", "answer": false, "sign": "entry", "source": "signs", "i18n": {"en": {"question": "Bicycles may always enter past this NO ENTRY sign.", "explanation": "It also applies to bicycles. Check supplementary plates for exceptions such as “except bicycles”."}, "zhCN": {"question": "自行车可以无条件通过这个“车辆禁止驶入”标志。", "explanation": "自行车也适用。请查看“自転車を除く”等辅助标志的例外。"}, "zhTW": {"question": "自行車可以無條件通過這個「車輛禁止進入」標誌。", "explanation": "自行車也適用。請查看「自転車を除く」等輔助標誌的例外。"}, "ko": {"question": "자전거는 이 차량 진입금지 표지를 조건 없이 통과할 수 있다.", "explanation": "자전거도 대상입니다. ‘自転車を除く’ 등 보조표지의 예외를 확인하세요."}, "vi": {"question": "Xe đạp luôn được đi vào qua biển CẤM ĐI VÀO này.", "explanation": "Biển cũng áp dụng cho xe đạp. Kiểm tra ngoại lệ trên biển phụ như ‘自転車を除く’ (trừ xe đạp)."}, "th": {"question": "จักรยานผ่านป้ายห้ามเข้านี้ได้โดยไม่มีเงื่อนไข", "explanation": "จักรยานก็อยู่ในข้อห้าม ตรวจข้อยกเว้นบนป้ายเสริม เช่น ‘自転車を除く’ หมายถึงยกเว้นจักรยาน"}}, "concept": "noentry"}, {"no": 4, "question": "この「車両通行止め」は、自動車だけを禁止している。", "explanation": "自転車も車両なので対象です。補助標識がある場合は条件も確認します。", "answer": false, "sign": "closed", "source": "signs", "i18n": {"en": {"question": "This NO VEHICLES sign prohibits only motor vehicles.", "explanation": "Bicycles are vehicles too. Check any supplementary conditions."}, "zhCN": {"question": "这个“车辆禁止通行”标志只禁止汽车。", "explanation": "自行车也是车辆。请同时确认辅助标志的条件。"}, "zhTW": {"question": "這個「車輛禁止通行」標誌只禁止汽車。", "explanation": "自行車也是車輛。請同時確認輔助標誌的條件。"}, "ko": {"question": "이 차량 통행금지 표지는 자동차만 금지한다.", "explanation": "자전거도 차량입니다. 보조표지가 있으면 조건도 확인하세요."}, "vi": {"question": "Biển CẤM PHƯƠNG TIỆN này chỉ cấm ô tô.", "explanation": "Xe đạp cũng là phương tiện. Kiểm tra điều kiện trên biển phụ nếu có."}, "th": {"question": "ป้ายห้ามยานพาหนะนี้ห้ามเฉพาะรถยนต์", "explanation": "จักรยานก็เป็นยานพาหนะ ตรวจเงื่อนไขบนป้ายเสริมด้วย"}}, "concept": "closed-sign"}, {"no": 5, "question": "この「一方通行」では、原則として矢印の方向に進む。", "explanation": "自転車も原則対象です。「自転車を除く」等の補助標識による例外を確認します。", "answer": true, "sign": "oneway", "source": "signs", "i18n": {"en": {"question": "At this ONE WAY sign, traffic normally follows the arrow.", "explanation": "It normally includes bicycles. Check supplementary plates for exceptions."}, "zhCN": {"question": "看到这个“单行道”标志，原则上须沿箭头方向行驶。", "explanation": "原则上也适用于自行车；请确认辅助标志有无例外。"}, "zhTW": {"question": "看到這個「單行道」標誌，原則上須沿箭頭方向行駛。", "explanation": "原則上也適用於自行車；請確認輔助標誌有無例外。"}, "ko": {"question": "이 일방통행 표지에서는 원칙적으로 화살표 방향으로 진행한다.", "explanation": "자전거도 원칙적으로 대상입니다. 보조표지의 예외를 확인하세요."}, "vi": {"question": "Tại biển MỘT CHIỀU này, về nguyên tắc phải đi theo mũi tên.", "explanation": "Thường áp dụng cả xe đạp. Kiểm tra ngoại lệ trên biển phụ."}, "th": {"question": "ที่ป้ายเดินรถทางเดียวนี้ โดยหลักต้องไปตามลูกศร", "explanation": "โดยหลักใช้กับจักรยานด้วย ตรวจข้อยกเว้นบนป้ายเสริม"}}, "concept": "oneway"}, {"no": 6, "question": "この標識の「50」は、50mphという意味である。", "explanation": "日本の最高速度の単位はkm/hです。道路状況に応じてさらに減速します。", "answer": false, "sign": "speed", "source": "signs", "i18n": {"en": {"question": "The “50” on this speed-limit sign means 50 mph.", "explanation": "Japanese speed limits use km/h. Slow further when conditions require."}, "zhCN": {"question": "这个限速标志的50表示每小时50英里。", "explanation": "日本限速单位是公里/小时；路况需要时进一步减速。"}, "zhTW": {"question": "這個速限標誌的50表示每小時50英里。", "explanation": "日本速限單位是公里/小時；路況需要時進一步減速。"}, "ko": {"question": "이 속도 표지의 50은 50mph를 뜻한다.", "explanation": "일본의 최고속도 단위는 km/h입니다. 상황에 따라 더 감속하세요."}, "vi": {"question": "Số 50 trên biển tốc độ này nghĩa là 50 dặm/giờ.", "explanation": "Nhật dùng km/h. Giảm tốc thêm khi điều kiện yêu cầu."}, "th": {"question": "เลข 50 บนป้ายความเร็วนี้หมายถึง 50 ไมล์ต่อชั่วโมง", "explanation": "ญี่ปุ่นใช้หน่วยกิโลเมตรต่อชั่วโมง ลดความเร็วเพิ่มเมื่อจำเป็น"}}, "concept": "speed-unit"}, {"no": 7, "question": "この「駐車禁止」と「駐停車禁止」は同じ意味である。", "explanation": "斜線1本は駐車禁止、赤い×は駐停車禁止。短時間でも駐車に該当することがあります。", "answer": false, "sign": "parking", "source": "signs", "i18n": {"en": {"question": "NO PARKING and NO STOPPING have the same meaning.", "explanation": "One slash means no parking; a red cross means no stopping or parking. Even a short stop can legally count as parking."}, "zhCN": {"question": "“禁止停车”和“禁止停车及临时停车”含义相同。", "explanation": "一条斜线为禁止停车，红色交叉为禁止停放及临时停车。短时间停车也可能属于法律上的停车。"}, "zhTW": {"question": "「禁止停車」和「禁止停車及臨時停車」含義相同。", "explanation": "一條斜線為禁止停車，紅色交叉為禁止停車及臨時停車。短時間停車也可能屬於法律上的停車。"}, "ko": {"question": "주차금지와 주정차금지는 같은 뜻이다.", "explanation": "빗금 하나는 주차금지, 빨간 X는 주정차금지입니다. 짧게 멈춰도 법률상 주차일 수 있습니다."}, "vi": {"question": "Biển CẤM ĐỖ và CẤM DỪNG có cùng ý nghĩa.", "explanation": "Một vạch chéo là cấm đỗ; dấu X đỏ là cấm dừng và đỗ. Dừng ngắn cũng có thể được pháp luật coi là đỗ."}, "th": {"question": "ป้ายห้ามจอดกับป้ายห้ามหยุดมีความหมายเหมือนกัน", "explanation": "เส้นทแยงหนึ่งเส้นคือห้ามจอด กากบาทแดงคือห้ามหยุดและจอด แม้หยุดสั้น ๆ ก็อาจถือเป็นการจอดตามกฎหมาย"}}, "concept": "parking-sign"}, {"no": 8, "question": "この「駐停車禁止」でも、ハザードを点ければ自由に停車できる。", "explanation": "ハザードを点けても禁止は解除されません。", "answer": false, "sign": "stopping", "source": "signs", "i18n": {"en": {"question": "At this NO STOPPING sign, using hazard lights lets you stop freely.", "explanation": "Hazard lights do not cancel the restriction."}, "zhCN": {"question": "看到这个“禁止停车及临时停车”标志，开双闪就可自由停下。", "explanation": "危险警告灯不会解除禁止规定。"}, "zhTW": {"question": "看到這個「禁止停車及臨時停車」標誌，開啟警示燈就可自由停下。", "explanation": "危險警告燈不會解除禁止規定。"}, "ko": {"question": "이 주정차금지 표지에서도 비상등을 켜면 자유롭게 정차할 수 있다.", "explanation": "비상등을 켜도 금지 규정은 해제되지 않습니다."}, "vi": {"question": "Tại biển CẤM DỪNG này, bật đèn khẩn cấp là được tự do dừng.", "explanation": "Đèn khẩn cấp không hủy bỏ quy định cấm."}, "th": {"question": "ที่ป้ายห้ามหยุดนี้ หากเปิดไฟฉุกเฉินก็หยุดได้อย่างอิสระ", "explanation": "ไฟฉุกเฉินไม่ยกเลิกข้อห้าม"}}, "concept": "stopping-sign"}, {"no": 9, "question": "この標識のある横断歩道で、横断しようとする歩行者がいれば、車両は一時停止する。", "explanation": "自転車も歩行者の横断を妨げてはいけません。", "answer": true, "sign": "crossing", "source": "signs", "i18n": {"en": {"question": "At the crosswalk indicated by this sign, vehicles must stop for pedestrians about to cross.", "explanation": "Bicycles must also avoid obstructing crossing pedestrians."}, "zhCN": {"question": "在此标志所示的人行横道，有行人准备过街时，车辆必须停车。", "explanation": "自行车也不得妨碍行人过街。"}, "zhTW": {"question": "在此標誌所示的行人穿越道，有行人準備過街時，車輛必須停車。", "explanation": "自行車也不得妨礙行人過街。"}, "ko": {"question": "이 표지의 횡단보도를 건너려는 보행자가 있으면 차량은 일시정지한다.", "explanation": "자전거도 보행자의 횡단을 방해하면 안 됩니다."}, "vi": {"question": "Tại vạch sang đường có biển này, phương tiện phải dừng khi có người chuẩn bị qua.", "explanation": "Xe đạp cũng không được cản trở người đi bộ qua đường."}, "th": {"question": "ที่ทางข้ามซึ่งมีป้ายนี้ ยานพาหนะต้องหยุดเมื่อมีคนกำลังจะข้าม", "explanation": "จักรยานก็ห้ามขัดขวางคนเดินเท้าที่ข้ามถนน"}}, "concept": "crosswalk-yield"}, {"no": 10, "question": "この標識で歩道通行が許される普通自転車は、歩行者より優先される。", "explanation": "歩道は歩行者優先。原則として車道寄りを徐行し、通行を妨げる場合は一時停止します。", "answer": false, "sign": "shared", "source": "faq", "i18n": {"en": {"question": "Where this sign permits ordinary bicycles on a sidewalk, cyclists have priority over pedestrians.", "explanation": "Pedestrians have priority. Normally ride slowly on the roadway side and stop if obstructing them."}, "zhCN": {"question": "此标志允许普通自行车在人行道通行，因此自行车优先于行人。", "explanation": "行人优先。原则上靠车行道侧慢行，妨碍行人时停车。"}, "zhTW": {"question": "此標誌允許普通自行車在人行道通行，因此自行車優先於行人。", "explanation": "行人優先。原則上靠車道側慢行，妨礙行人時停車。"}, "ko": {"question": "이 표지가 보도 통행을 허용하므로 일반 자전거가 보행자보다 우선한다.", "explanation": "보행자가 우선입니다. 원칙적으로 차도 쪽을 서행하고 방해할 때는 일시정지합니다."}, "vi": {"question": "Biển này cho xe đạp thông thường đi trên vỉa hè nên xe đạp được ưu tiên hơn người đi bộ.", "explanation": "Người đi bộ được ưu tiên. Thông thường đi chậm phía gần đường xe chạy và dừng khi cản trở họ."}, "th": {"question": "เมื่อป้ายนี้อนุญาตจักรยานทั่วไปบนทางเท้า จักรยานจึงมีสิทธิก่อนคนเดินเท้า", "explanation": "คนเดินเท้ามีสิทธิก่อน โดยหลักขี่ช้าด้านติดถนนและหยุดหากกีดขวางคนเดินเท้า"}}, "concept": "bike-pedestrian"}]}, {"id": 1, "title": "基本ルール", "questions": [{"no": 1, "question": "日本では、自動車は原則として道路の左側を通行する。", "answer": true, "explanation": "日本は左側通行です。", "i18n": {"en": {"question": "In Japan, vehicles generally drive on the left side of the road.", "explanation": "Japan uses left-hand traffic."}, "ko": {"question": "일본에서는 자동차가 원칙적으로 도로의 왼쪽으로 통행합니다.", "explanation": "일본은 좌측통행입니다."}, "zhTW": {"question": "在日本，汽車原則上靠道路左側通行。", "explanation": "日本採用左側通行。"}, "zhCN": {"question": "在日本，汽车原则上靠道路左侧通行。", "explanation": "日本实行左侧通行。"}, "th": {"question": "ในประเทศญี่ปุ่น โดยหลักแล้วรถยนต์ต้องวิ่งทางด้านซ้ายของถนน", "explanation": "ญี่ปุ่นใช้ระบบจราจรชิดซ้าย"}, "vi": {"question": "Ở Nhật Bản, ô tô về nguyên tắc đi bên trái đường.", "explanation": "Nhật Bản áp dụng giao thông bên trái."}}, "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・第4章・第5章", "concept": "drive-left"}, {"no": 2, "question": "赤信号でも、歩行者や車がいなければ左折してよい。", "answer": false, "explanation": "日本では原則として赤信号で左折できません。ただし、白地に青い左向き矢印の「左折可」標示板がある場所では、歩行者や他の交通を妨げず、安全を確認して左折できます。青矢印信号による許可も別にあります。", "i18n": {"en": {"question": "At a red light, you may turn left if there are no pedestrians or vehicles.", "explanation": "In Japan, generally do not turn left on red. An exception is a white rectangular “left turn permitted” plate with a blue left arrow: you may turn after checking safety, without obstructing pedestrians or other traffic. A green arrow signal can also permit movement."}, "ko": {"question": "빨간불이어도 보행자나 차량이 없으면 좌회전해도 됩니다.", "explanation": "일본에서는 원칙적으로 빨간불에 좌회전할 수 없습니다. 다만 흰 바탕에 파란 왼쪽 화살표가 있는 좌회전 허용 표지판이 있으면 보행자와 다른 교통을 방해하지 않고 안전을 확인해 좌회전할 수 있습니다. 녹색 화살표 신호에 의한 허용도 있습니다."}, "zhTW": {"question": "紅燈時，如果沒有行人或車輛，也可以左轉。", "explanation": "日本原則上禁止紅燈左轉。但設有白底藍色左箭頭的「左折可」標示板時，可在確認安全且不妨礙行人及其他交通的情況下左轉。綠色箭頭號誌也可另行允許通行。"}, "zhCN": {"question": "红灯时，如果没有行人或车辆，也可以左转。", "explanation": "日本原则上禁止红灯左转。但设有白底蓝色左箭头的“左折可”标示板时，可在确认安全且不妨碍行人及其他交通的情况下左转。绿色箭头信号也可另行允许通行。"}, "th": {"question": "เมื่อไฟแดง หากไม่มีคนเดินเท้าหรือรถคันอื่น สามารถเลี้ยวซ้ายได้", "explanation": "ในญี่ปุ่นโดยหลักห้ามเลี้ยวซ้ายเมื่อไฟแดง แต่หากมีแผ่นป้ายสี่เหลี่ยมพื้นขาวรูปลูกศรซ้ายสีน้ำเงินที่อนุญาตให้เลี้ยวซ้าย จะเลี้ยวได้หลังตรวจความปลอดภัยโดยไม่กีดขวางคนเดินเท้าหรือการจราจรอื่น ไฟลูกศรสีเขียวก็อาจอนุญาตให้ไปได้เช่นกัน"}, "vi": {"question": "Khi đèn đỏ, nếu không có người đi bộ hoặc xe khác thì được rẽ trái.", "explanation": "Ở Nhật, về nguyên tắc không được rẽ trái khi đèn đỏ. Ngoại lệ là bảng chữ nhật nền trắng, mũi tên trái màu xanh lam cho phép rẽ trái: phải kiểm tra an toàn và không cản người đi bộ hay giao thông khác. Đèn mũi tên xanh cũng có thể cho phép đi."}}, "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章第2節1(4)・付表2(2)", "sourcePage": 7, "concept": "red-turn-left"}, {"no": 3, "question": "一時停止標識がある場所では、車が来ていなければ徐行で通過してよい。", "answer": false, "explanation": "停止線の直前で完全に停止します。", "i18n": {"en": {"question": "At a stop sign, you may pass slowly without stopping if no vehicle is coming.", "explanation": "You must come to a complete stop before the stop line."}, "ko": {"question": "일시정지 표지가 있는 곳에서는 차량이 오지 않으면 서행으로 통과해도 됩니다.", "explanation": "정지선 바로 앞에서 완전히 정지해야 합니다."}, "zhTW": {"question": "有停車標誌的地方，如果沒有來車，可以慢行通過。", "explanation": "必須在停止線前完全停車。"}, "zhCN": {"question": "有停车标志时，如果没有来车，可以慢行通过。", "explanation": "必须在停止线前完全停车。"}, "th": {"question": "เมื่อมีป้ายหยุด หากไม่มีรถมา สามารถขับผ่านช้า ๆ โดยไม่หยุดได้", "explanation": "ต้องหยุดรถให้สนิทก่อนเส้นหยุด"}, "vi": {"question": "Ở nơi có biển dừng, nếu không có xe tới thì có thể đi chậm qua mà không cần dừng.", "explanation": "Phải dừng hẳn trước vạch dừng."}}, "sign": "stop", "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・第4章・第5章", "concept": "stop-obligation"}, {"no": 4, "question": "横断歩道を渡ろうとする歩行者がいるときは、車は一時停止する。", "answer": true, "explanation": "横断歩道では歩行者優先です。", "i18n": {"en": {"question": "When a pedestrian is about to cross at a crosswalk, the vehicle must stop.", "explanation": "Pedestrians have priority at crosswalks."}, "ko": {"question": "횡단보도를 건너려는 보행자가 있을 때 차량은 일시정지해야 합니다.", "explanation": "횡단보도에서는 보행자가 우선입니다."}, "zhTW": {"question": "有行人準備通過行人穿越道時，車輛必須停車。", "explanation": "在行人穿越道，行人優先。"}, "zhCN": {"question": "有行人准备通过人行横道时，车辆必须停车。", "explanation": "在人行横道处，行人优先。"}, "th": {"question": "เมื่อมีคนเดินเท้ากำลังจะข้ามทางม้าลาย รถต้องหยุด", "explanation": "ทางม้าลายให้สิทธิคนเดินเท้าก่อน"}, "vi": {"question": "Khi có người đi bộ chuẩn bị qua vạch sang đường, xe phải dừng lại.", "explanation": "Tại vạch sang đường, người đi bộ được ưu tiên."}}, "source": "crosswalk", "concept": "crosswalk-yield"}, {"no": 5, "question": "踏切では、警報機が鳴っていなくても原則として一時停止して安全確認する。", "answer": true, "explanation": "停止し、左右と音を確認します。", "i18n": {"en": {"question": "At a railroad crossing, you generally stop and check safety even if the alarm is not sounding.", "explanation": "Stop and check both directions and listen for trains."}, "ko": {"question": "철도 건널목에서는 경보기가 울리지 않아도 원칙적으로 일시정지하고 안전을 확인합니다.", "explanation": "정지한 뒤 좌우와 소리를 확인합니다."}, "zhTW": {"question": "在平交道，即使警報器沒有響，原則上也要停車確認安全。", "explanation": "停車後確認左右方向，並注意聲音。"}, "zhCN": {"question": "铁路道口即使警报器没有响，原则上也要停车确认安全。", "explanation": "停车后确认左右方向并注意声音。"}, "th": {"question": "ที่ทางข้ามรถไฟ แม้สัญญาณเตือนจะไม่ดัง โดยหลักแล้วต้องหยุดและตรวจสอบความปลอดภัย", "explanation": "ให้หยุด แล้วตรวจสอบซ้ายขวาและฟังเสียงรถไฟ"}, "vi": {"question": "Tại đường ngang đường sắt, dù chuông cảnh báo không kêu, về nguyên tắc vẫn phải dừng và kiểm tra an toàn.", "explanation": "Hãy dừng lại, kiểm tra hai bên và lắng nghe âm thanh tàu."}}, "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・第4章・第5章", "concept": "rail-stop"}, {"no": 6, "question": "後部座席の同乗者は、シートベルトをしなくてもよい。", "answer": false, "explanation": "後席もシートベルト着用が必要です。", "i18n": {"en": {"question": "Rear-seat passengers do not need to wear seat belts.", "explanation": "Seat belts are required in rear seats as well."}, "ko": {"question": "뒷좌석 동승자는 안전벨트를 하지 않아도 됩니다.", "explanation": "뒷좌석도 안전벨트 착용이 필요합니다."}, "zhTW": {"question": "後座乘客不繫安全帶也可以。", "explanation": "後座也必須繫安全帶。"}, "zhCN": {"question": "后排乘客不系安全带也可以。", "explanation": "后排座位也需要系安全带。"}, "th": {"question": "ผู้โดยสารเบาะหลังไม่จำเป็นต้องคาดเข็มขัดนิรภัย", "explanation": "เบาะหลังก็ต้องคาดเข็มขัดนิรภัยเช่นกัน"}, "vi": {"question": "Hành khách ghế sau không cần thắt dây an toàn.", "explanation": "Ghế sau cũng cần thắt dây an toàn."}}, "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・第4章・第5章", "concept": "belt-all"}, {"no": 7, "question": "運転中にスマートフォンを手に持って通話してはいけない。", "answer": true, "explanation": "ながら運転は重大事故につながります。", "i18n": {"en": {"question": "You must not talk on a smartphone held in your hand while driving.", "explanation": "Distracted driving can lead to serious crashes."}, "ko": {"question": "운전 중 스마트폰을 손에 들고 통화해서는 안 됩니다.", "explanation": "주의 산만 운전은 중대한 사고로 이어질 수 있습니다."}, "zhTW": {"question": "駕駛中不得手持智慧型手機通話。", "explanation": "分心駕駛可能導致重大事故。"}, "zhCN": {"question": "驾驶中不得手持智能手机通话。", "explanation": "分心驾驶可能导致重大事故。"}, "th": {"question": "ห้ามถือสมาร์ตโฟนคุยโทรศัพท์ขณะขับรถ", "explanation": "การขับรถโดยเสียสมาธิอาจนำไปสู่อุบัติเหตุร้ายแรง"}, "vi": {"question": "Không được cầm điện thoại thông minh để nói chuyện khi đang lái xe.", "explanation": "Lái xe mất tập trung có thể dẫn đến tai nạn nghiêm trọng."}}, "source": "phone", "concept": "phone-handheld"}, {"no": 8, "question": "追越しが終わったあとも、高速道路の追越車線を走り続けてよい。", "answer": false, "explanation": "追越し後は走行車線に戻ります。", "i18n": {"en": {"question": "After overtaking, you may continue driving in the passing lane on an expressway.", "explanation": "After overtaking, return to the driving lane."}, "ko": {"question": "추월이 끝난 뒤에도 고속도로 추월차로를 계속 달려도 됩니다.", "explanation": "추월 후에는 주행차로로 돌아가야 합니다."}, "zhTW": {"question": "超車結束後，也可以繼續行駛在高速公路的超車道。", "explanation": "超車後應回到行駛車道。"}, "zhCN": {"question": "超车结束后，也可以继续在高速公路超车道行驶。", "explanation": "超车后应回到行驶车道。"}, "th": {"question": "หลังจากแซงเสร็จแล้ว สามารถขับต่อในช่องแซงบนทางด่วนได้", "explanation": "หลังแซงเสร็จ ให้กลับเข้าสู่ช่องวิ่งปกติ"}, "vi": {"question": "Sau khi vượt xe, có thể tiếp tục chạy ở làn vượt trên đường cao tốc.", "explanation": "Sau khi vượt, hãy trở lại làn chạy."}}, "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・第4章・第5章", "concept": "passing-lane"}, {"no": 9, "question": "酒を飲んだ人に車を運転させることも違反になる。", "answer": true, "explanation": "酒気帯び運転の助長も厳しく問われます。", "i18n": {"en": {"question": "It is also a violation to let a person who has consumed alcohol drive.", "explanation": "Helping or allowing drunk driving is treated strictly."}, "ko": {"question": "술을 마신 사람에게 차를 운전하게 하는 것도 위반이 됩니다.", "explanation": "음주운전을 돕거나 허용하는 행위도 엄격히 다루어집니다."}, "zhTW": {"question": "讓喝過酒的人開車也屬於違規。", "explanation": "協助或縱容酒後駕駛會被嚴格追究。"}, "zhCN": {"question": "让喝过酒的人开车也可能违法。", "explanation": "帮助或纵容酒后驾驶会被严格追究。"}, "th": {"question": "การให้คนที่ดื่มแอลกอฮอล์ขับรถก็เป็นการฝ่าฝืน", "explanation": "การช่วยหรือยินยอมให้เมาแล้วขับจะถูกดำเนินการอย่างเข้ ": 4, "question": "右側通行に慣れた運転者も、日本で右左折した後は道路の左側へ入る。", "answer": true, "explanation": "右左折の後も左側通行です。交差点に入る前に、曲がった先の進入位置を確認します。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・付表1・付表3", "concept": "drive-left"}, {"no": 5, "question": "国際運転免許証があれば、どの国の免許でも日本で必ず運転できる。", "answer": false, "explanation": "条約、免許の種類、期間など条件があります。", "source": "foreign", "concept": "licence-validity"}, {"no": 6, "question": "レンタカーを借りる前に、標識と交通ルールを確認するのが望ましい。", "answer": true, "explanation": "事故防止に有効です。", "source": "foreign", "concept": "licence-validity"}, {"no": 7, "question": "普通自動車は、赤信号と青い右矢印が同時に出たとき、安全を確認して右折できる。", "answer": true, "explanation": "普通自動車は青矢印の方向へ進めます。横断中の歩行者などの安全を確認します。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・付表1・付表3", "concept": "green-arrow"}, {"no": 8, "question": "黄色の矢印信号は、自動車もその方向へ進める合図である。", "answer": false, "explanation": "黄色矢印は路面電車用です。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・付表1・付表3", "concept": "yellow-arrow"}, {"no": 9, "question": "「止まれ」の標識は、見通しが良ければ停止しなくてもよい。", "answer": false, "explanation": "見通しに関係なく完全停止します。", "sign": "stop", "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・付表1・付表3", "concept": "stop-obligation"}, {"no": 10, "question": "標識で警音器を鳴らすことが指定された場所では、危険が見えなくてもクラクションを鳴らす。", "answer": true, "explanation": "指定場所等では鳴らす義務があります。それ以外では、危険防止のためやむを得ない場合を除き使用できません。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第1章・付表1・付表3", "concept": "horn-obligation"}], "titleI18n": {"ja": "外国人が間違えやすいルール", "en": "Rules Foreign Drivers Often Miss", "ko": "외국인 운전자가 자주 헷갈리는 규칙", "zhTW": "外國駕駛人容易誤解的規則", "zhCN": "外国驾驶人容易误解的规则", "th": "กฎที่ผู้ขับขี่ต่างชาติมักเข้าใจผิด", "vi": "Quy tắc người lái nước ngoài dễ nhầm"}, "legacy": true}, {"id": 3, "title": "交差点", "questions": [{"no": 1, "question": "右折時、対向直進車の進行を妨げてはいけない。", "answer": true, "explanation": "右折車は対向直進車に注意します。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "right-oncoming"}, {"no": 2, "question": "青信号で適法に交差点へ入り右折待ちをしていた車は、信号が赤になった場合も、周囲の安全を確認して交差点から出る。", "answer": true, "explanation": "対向車や横断歩行者の通行を妨げず、交差点から安全に退出します。赤になってから新たに進入してよいという意味ではありません。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "intersection-exit"}, {"no": 3, "question": "左折時は、左後方の自転車や歩行者を確認する。", "answer": true, "explanation": "巻き込み事故防止が重要です。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "left-blindspot"}, {"no": 4, "question": "交差点の直前で急に進路変更して右左折してもよい。", "answer": false, "explanation": "早めに合図し、安全に進路変更します。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "turn-preparation"}, {"no": 5, "question": "信号のない交差点では、道路の優先関係を確認せず、先に交差点へ近づいた車が先に進む。", "answer": false, "explanation": "先着順ではありません。一時停止・優先道路・道路の幅など、その交差点の優先関係を確認します。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "intersection-priority"}, {"no": 6, "question": "交差点内で渋滞して停止するおそれがあるときも、青信号なら進入してよい。", "answer": false, "explanation": "交差点をふさがないよう進入を控えます。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "intersection-blocked"}, {"no": 7, "question": "右左折の合図は、曲がり始める直前に出せばよい。", "answer": false, "explanation": "右左折の合図は原則としてその地点の30m手前から行い、行為が終わるまで続けます。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第5節1（合図）", "sourcePage": 51, "concept": "turn-signal"}, {"no": 8, "question": "横断歩道等の直前で停止している車両等の側方を通過してその前方へ出ようとするときは、一時停止する。", "answer": true, "explanation": "停止車両の陰の歩行者を見落とさないよう、その前方へ出る前に一時停止します。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "crosswalk-stopped"}, {"no": 9, "question": "交差点では、対向車だけ見ていれば十分である。", "answer": false, "explanation": "歩行者、自転車、二輪車も確認します。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "blindspot-check"}, {"no": 10, "question": "右折時、大型車の陰から二輪車が出てくることがある。", "answer": true, "explanation": "死角を予測します。", "source": "manual", "sourceDetail": "交通の方法に関する教則：第5章第3節・第7節", "concept": "right-oncoming"}], "titleI18n": {"ja": "交差点", "en": "Intersections", "ko": "교차로", "zhTW": "交叉路口", "zhCN": "交叉路口", "th": " function fingerprint(q){return q.question+'|'+q.answer;}

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tr(k){return U[lang][k];}
function m(k){return messages[lang][k]||messages.ja[k];}
function local(q){return lang==='ja'?{question:q.question,explanation:q.explanation}:q.i18n[lang];}
function available(p){return lang==='ja'||p.questions.every(q=>q.i18n&&q.i18n[lang]);}
function eligible(){return patterns.filter(available);}
function title(p){return p.titleI18n?.[lang]||p.title;}
function signName(key){return signTitleRows[lang][signKeys.indexOf(key)]||key;}
function link(source,page=null){const href=sources[source]+(source==='manual'&&Number.isInteger(page)?'#page='+page:'');return '<a class="source-link" target="_blank" rel="noopener noreferrer" href="'+href+'">↗ '+esc(tr('ref'))+'</a>';}
function referenceText(q){
 if(!q.sourceDetail)return '';
 if(lang==='ja')return q.sourceDetail;
 const labels={en:['Traffic instruction manual','Chapter','Section','Appendix'],ko:['교통 교칙','장','절','부표'],zhCN:['交通教则','章','节','附表'],zhTW:['交通教則','章','節','附表'],vi:['Giáo trình giao thông','Chương','Mục','Phụ lục'],th:['คู่มือจราจร','บท','ส่วน','ตารางภาคผนวก']}[lang];
 let detail=q.sourceDetail.replace('交通の方法に関する教則：','');
 detail=detail.replace(/第(\d+)章/g,(_,n)=>labels[1]+' '+n+' ').replace(/第(\d+)節/g,(_,n)=>labels[2]+' '+n+' ').replace(/付表/g,labels[3]+' ').replace(/[・、]/g,', ');
 return labels[0]+': '+detail.trim();
}
function imageTag(key,cls=''){return '<img class="'+cls+'" src="'+signImages[key]+'" alt="'+esc(signName(key))+'" decoding="async">';}
function setView(view){document.querySelectorAll('[id^="view-"]').forEach(el=>el.hidden=el.id!=='view-'+view);document.querySelectorAll('[data-view]').forEach(b=>{const selected=b.dataset.view===view;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;});}
function staticText(){
 document.documentElement.lang=docLang[lang];document.title=tr('title');$('appTitle').textContent=tr('title');$('appLead').textContent=tr('lead');$('version').textContent=tr('updated');$('scope').textContent=tr('scope');
 document.querySelectorAll('[data-view]').forEach(b=>b.textContent=tr(b.dataset.view));
 $('answeredLabel').textContent=m('answered');$('scoreLabel').textContent=m('score');$('gradeButton').textContent=m('grade');$('resetButton').textContent=m('retry');$('shuffleButton').textContent=tr('random');$('mistakesButton').textContent=tr('mistakes');$('noticeText').textContent=tr('notice');
 $('appFooter').innerHTML=esc(tr('legal'))+'<br>'+esc(tr('offline'));
 const cards=[['2026.04.01',title(patterns[0]),tr('keychanges')],['2026.09.01','30 km/h',tr('localroads')],['2024.11.01',tr('earlier'),tr('inforce')]];
 $('summary').innerHTML=cards.map(c=>'<article><span class="date">'+esc(c[0])+'</span><strong>'+esc(c[1])+'</strong><small>'+esc(c[2])+'</small></article>').join('');
 const list=eligible();$('patternSelect').innerHTML=list.map(p=>'<option value="'+p.id+'">'+esc(title(p))+'</option>').join('');$('patternSelect').value=current.id;
 $('bilingualLabel').textContent=tr('bilingual');$('bilingualToggle').hidden=lang==='ja';updateHistoryUI();

function renderGuide(){
 const guide=[['2026.04.01',patterns[0].questions[0]],['2026.04.01',patterns[0].questions[7]],['2026.09.01',patterns[0].questions[5]],['2024.11.01',patterns[0].questions[8]]];
 $('view-guide').innerHTML='<div class="panel"><h2>'+esc(tr('guideTitle'))+'</h2><div class="guide-grid">'+guide.map(([date,q])=>'<article class="guide-card updated"><b>'+date+' · '+esc(tr('inforce'))+'</b><h3>'+esc(q===patterns[0].questions[8]?tr('earlier'):local(q).question)+'</h3><p>'+esc(local(q).explanation)+'</p>'+link(q.source)+'</article>').join('')+'</div><p class="footnote">'+esc(tr('bikeSide'))+link('passing')+'</p></div>'+
 '<div class="panel"><h2>'+esc(tr('fineTitle'))+'</h2><div class="table-wrap"><table><thead><tr><th>'+esc(tr('violation'))+'</th><th>'+esc(tr('amount'))+'</th></tr></thead><tbody>'+[['phoneLabel','12,000'],['wrongsideLabel','6,000'],['signalLabel','6,000'],['stopLabel','5,000']].map(r=>'<tr><td>'+esc(tr(r[0]))+'</td><td>¥'+r[1]+'</td></tr>').join('')+'</tbody></table></div><p class="footnote">'+esc(tr('fineNote'))+link('fine')+'</p><h3 style="margin-top:24px">'+esc(tr('severeTitle'))+'</h3><p>'+esc(tr('phoneDanger'))+'</p>'+link('phone')+'<p style="margin-top:12px">'+esc(tr('alcoholPenalty'))+'</p>'+link('alcohol')+'</div>'+
 '<div class="panel"><h2>'+esc(tr('keychanges'))+'</h2><ul class="mini-list">'+['licence','navigation','turning'].map(k=>'<li>'+esc(tr(k))+'</li>').join('')+'</ul>'+link('foreign')+'</div>';
}
function renderSigns(){
 const qs=patterns[2].questions;
 $('view-signs').innerHTML='<div class="panel"><h2>'+esc(tr('signs'))+'</h2><p class="footnote" style="margin-bottom:20px">'+esc(tr('signhelp'))+'</p><div class="sign-grid">'+signKeys.map((key,i)=>{const q=qs.find(q=>q.sign===key);return '<article class="sign-card">'+imageTag(key)+'<h3>'+esc(signName(key))+'</h3><p>'+esc(local(q).explanation)+'</p></article>';}).join('')+'</div><p class="footnote">'+esc(extra('attribution'))+'</p>'+link('signs')+link('terms')+'</div>';
}
function renderSources(){
 const docs=[['etc','NEXCO西日本 / West Nippon Expressway','ETC安全運転のお願い / ETC safe driving'],['manual','警察庁 / NPA','交通の方法に関する教則（2024年掲載版） / Traffic instruction manual'],['terms','警察庁 / NPA','利用規約・出典・加工表記 / Terms and attribution'],['education','警察庁 / NPA','交通安全情報 / Traffic safety information'],['highway','警察庁 / NPA','高速道路 / Expressway safety'],['crosswalk','警察庁 / NPA','横断歩道 / Crosswalks'],['aori','警察庁 / NPA','妨害運転 / Aggressive driving'],['recorder','警察庁 / NPA','記録映像 / Dashcam guidance'],['system','警察庁 / NPA','自転車の新しい制度 / Blue-ticket system'],['control','警察庁 / NPA','指導・取締り / Enforcement'],['rules','警察庁 / NPA','自転車の交通ルール / Cycling rules'],['faq','警察庁 / NPA','歩道・ヘルメット・固定スマホ等 / FAQ'],['speed','警察庁 / NPA','生活道路の法定速度 / Local-road speed limits'],['passing','警察庁 / NPA','側方通過の新ルール / Passing bicycles (PDF)'],['fine','福岡県 / Fukuoka Prefecture','青切符・反則金の例 / Payment examples'],['phone','警察庁 / NPA','携帯電話使用・罰則 / Phone use and penalties'],['alcohol','警察庁 / NPA','飲酒運転 / Alcohol rules (PDF)'],['signs','警察庁 / NPA','外国人運転者向け標識資料・画像出典 / Sign images (PDF)'],['standards','国土交通省 / MLIT','道路標識一覧 / Road-sign catalogue (PDF)'],['foreign','警察庁 / NPA','英語による交通情報・外国免許 / English traffic information']];
 $('view-sources').innerHTML='<div class="panel"><h2>'+esc(tr('sources'))+'</h2><p>'+esc(tr('updated'))+'</p><p class="footnote">'+esc(tr('coverage'))+'</p><ul class="sources">'+docs.map(([key,org,name])=>'<li><a target="_blank" rel="noopener noreferrer" href="'+sources[key]+'">'+esc(name)+'</a><div class="source-kind">'+esc(org)+'</div></li>').join('')+'</ul><p class="footnote">'+esc(extra('sourceScope'))+'</p><p class="footnote">'+esc(extra('attribution'))+'</p>'+link('terms')+'<p class="footnote">'+esc(tr('legal'))+'</p><p class="footnote">'+esc(tr('offline'))+'</p></div>';
}
function paintQuestions(){
 $('quizNotice').hidden=!current.limited;$('quizNotice').textContent=current.limited?extra('limitedQuiz'):'';
 $('quizTitle').textContent=title(current);$('patternSelect').value=current.id||'';
 $('questionList').innerHTML=current.questions.map((q,i)=>{const l=local(q);return '<article class="question" data-index="'+i+'"><div class="num">'+(i+1)+'</div><div class="qtext" id="question-'+i+'">'+esc(l.question)+(lang!=='ja'&&showJapanese?'<span class="original" lang="ja">'+esc(q.question)+'</span>':'')+(q.sign?imageTag(q.sign,'sign-q'):'')+'</div><div class="answer-box" role="group" aria-labelledby="question-'+i+'">'+[true,false].map(v=>'<input id="q'+i+'-'+v+'" name="q'+i+'" type="radio" value="'+v+'" '+(answers[i]===v?'checked ':'')+(graded?'disabled':'')+'><label for="q'+i+'-'+v+'" title="'+esc(v?tr('true'):tr('false'))+'"><span aria-hidden="true">'+(v?'○':'×')+'</span><span style="display:block;font-size:10px;line-height:1.2">'+esc(v?tr('true'):tr('false'))+'</span></label>').join('')+'</div><div class="explain"></div></article>';}).join('');
 $('questionList').querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{answers[Number(input.name.slice(1))]=input.value==='true';progress();}));
 if(graded)paintGrade();else{$('scoreCount').textContent='—';$('resultBox').innerHTML='<h2>'+esc(m('waitingTitle'))+'</h2><p>'+esc(tr('aftergrade'))+'</p>';}
 progress();
}
function renderQuiz(p){clearTimeout(timer);timer=null;current=p;answers=Array(p.questions.length).fill(null);graded=false;paintQuestions();moveCar(0);}
function progress(){const n=answers.filter(a=>a!==null).length;$('answeredCount').textContent=n;$('progressText').textContent=n+' / '+current.questions.length;$('gradeButton').disabled=graded||n!==current.questions.length;}
function moveCar(score,animated=false){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const duration=animated&&!reduce?Math.max(.4,score*.12):0;$('car').style.transitionDuration=duration+'s';const count=current.questions.length;requestAnimationFrame(()=>{$('car').style.transform='translateX('+Math.round(Math.max(0,$('road').clientWidth-78)*score/count)+'px)';});return duration*1000;}
function paintGrade(){let score=0;current.questions.forEach((q,i)=>{const ok=answers[i]===q.answer;if(ok)score++;const card=$('questionList').querySelector('[data-index="'+i+'"]');card.classList.add(ok?'correct':'wrong');card.querySelector('.explain').innerHTML='<strong>'+esc(ok?m('correct'):m('wrong'))+' '+esc(m('correctAnswer'))+': '+(q.answer?'○ '+esc(tr('true')):'× '+esc(tr('false')))+'</strong><br>'+esc(local(q).explanation)+(lang!=='ja'&&showJapanese?'<span class="original" lang="ja">'+esc(q.explanation)+'</span>':'')+(q.sourceDetail?'<small class="source-kind">'+esc(referenceText(q))+'</small>':'')+(q.source?link(q.source,q.sourcePage):'');});$('scoreCount').textContent=score;showResult(score);return score;}
function grade(){if(graded||answers.some(a=>a===null))return;graded=true;current.questions.forEach((q,i)=>{if(answers[i]===q.answer)mistakes.delete(q.uid);else mistakes.set(q.uid,q);});saveHistory();const score=paintGrade();$('questionList').querySelectorAll('input').forEach(el=>el.disabled=true);progress();const ms=moveCar(score,true);if(ms){$('resultBox').innerHTML='<h2>'+esc(m('gradingTitle'))+'</h2>';timer=setTimeout(()=>{showResult(score);timer=null;},ms);}}
function showResult(score){const n=current.questions.length,percent=Math.round(score/n*100);const heading=score===n?'greatTitle':percent>=80?'goodTitle':'retryTitle',body=score===n?'greatBody':percent>=80?'goodBody':'retryBody';$('resultBox').innerHTML='<div class="reward '+(score===n?'reward-perfect':percent>=80?'reward-almost':'reward-try')+'"><strong>'+esc(m(heading))+'</strong></div><p style="font-size:24px;font-weight:800">'+score+' / '+n+' <small>('+percent+'%)</small></p><p>'+esc(m(body))+'</p>';}
function shuffled(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function matchQuestionSlots(pool,slots){
 const groups=new Map();for(const q of pool){const key=q.concept||q.uid;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q);}
 const candidates=slots.map(answer=>shuffled([...groups].filter(([,qs])=>qs.some(q=>q.answer===answer)).map(([key])=>key)));
 const assigned=new Map();
 function match(slot,seen){for(const key of candidates[slot]){if(seen.has(key))continue;seen.add(key);if(!assigned.has(key)||match(assigned.get(key),seen)){assigned.set(key,slot);return true;}}return false;}
 for(let slot=0;slot<slots.length;slot++){if(!match(slot,new Set()))return null;}
 return shuffled([...assigned].map(([key,slot])=>shuffled(groups.get(key).filter(q=>q.answer===slots[slot]))[0]));
}
function selectBalancedQuestions(pool){
 const result=matchQuestionSlots(pool,shuffled([true,true,true,true,true,false,false,false,false,false]));
 if(!result)throw new Error('Insufficient distinct concepts for balanced quiz');return result;
}
function createRandomRound(pool){
 let qs,limited=false;
 try{qs=selectBalancedQuestions(pool);}catch{
  limited=true;
  const count=Math.min(10,new Set(pool.map(q=>q.concept||q.uid)).size);
  if(!count)return null;
  // Keep the largest possible unique-concept round; choose the closest feasible balance.
  const counts=shuffled(Array.from({length:count+1},(_,i)=>i)).sort((a,b)=>Math.abs(a-count/2)-Math.abs(b-count/2));
  for(const nTrue of counts){qs=matchQuestionSlots(pool,shuffled([...Array(nTrue).fill(true),...Array(count-nTrue).fill(false)]));if(qs)break;}
 }
 if(!qs?.length)return null;
 const titles=Object.fromEntries(Object.keys(U).map(k=>[k,limited?extraRows[k][extraKeys.indexOf('randomGeneral')]:U[k].random]));
 return {title:titles[lang],titleI18n:titles,questions:qs,custom:true,limited};
}
function randomQuiz(){const round=createRandomRound(eligible().flatMap(p=>p.questions));if(round)renderQuiz(round);else{$('quizNotice').hidden=false;$('quizNotice').textContent=extra('emptyQuiz');}}
function review(){const qs=[...mistakes.values()].filter(q=>lang==='ja'||q.i18n?.[lang]);if(!qs.length){$('resultBox').innerHTML='<p>'+esc(tr('none'))+'</p>';return;}renderQuiz({title:tr('mistakes'),titleI18n:Object.fromEntries(Object.keys(U).map(k=>[k,U[k].mistakes])),questions:shuffled(qs).slice(0,10),custom:true});}
$('languageSelect').addEventListener('change',e=>{clearTimeout(timer);timer=null;lang=e.target.value;const keep=available(current);if(!keep){current=patterns[0];answers=Array(10).fill(null);graded=false;}staticText();paintQuestions();moveCar(graded?Number($('scoreCount').textContent):0);});
$('patternSelect').addEventListener('change',e=>renderQuiz(patterns.find(p=>String(p.id)===e.target.value)));
$('gradeButton').addEventListener('click',grade);$('resetButton').addEventListener('click',()=>renderQuiz(current));$('shuffleButton').addEventListener('click',randomQuiz);$('mistakesButton').addEventListener('click',review);
const tabs=[...document.querySelectorAll('[data-view]')];
tabs.forEach((b,i)=>{b.addEventListener('click',()=>setView(b.dataset.view));b.addEventListener('keydown',e=>{let j;if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;e.preventDefault();setView(tabs[j].dataset.view);tabs[j].focus();});});
$('clearHistory').addEventListener('click',()=>{mistakes.clear();saveHistory();});
window.addEventListener('resize',()=>moveCar(graded?Number($('scoreCount').textContent):0));
$('bilingual').addEventListener('change',e=>{showJapanese=e.target.checked;paintQuestions();});
staticText();renderQuiz(current);
